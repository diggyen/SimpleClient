# GRUB configuration of a disk install; sc-install puts it on the ESP as
# /boot/grub/grub.cfg. Both GRUBs read it: the BIOS one and the signed UEFI one.
#
# The system lives in two slots, SC_A and SC_B, each holding both kernels.
# grubenv carries the choices:
#   sc_boot      the slot known to work
#   sc_try       a slot holding a fresh update, booted once. The try is cleared
#                before its kernel even starts, so an update that never reports
#                back — it panicked, hung, or the kiosk would not come up, and
#                the machine was switched off — is followed by a boot of the
#                known-good slot.
#   sc_kernel    "new" or "lts": the kernel known to work on this machine
#   sc_kpending  set on every normal boot and cleared by the kiosk once it is
#                up; still set means the last boot never got there, and the
#                other kernel is tried, as on the USB stick (see the ISO's
#                grub.cfg)
# The kiosk sets sc_boot and sc_kernel to what it runs from once that has proven
# itself, and clears sc_kpending.
set timeout=1
set default=0

load_env
if [ -n "${sc_try}" ]; then
    set slot="${sc_try}"
    set sc_try=
    save_env sc_try
else
    set slot="${sc_boot}"
    if [ "${sc_kpending}" = "1" ]; then
        if [ "${sc_kernel}" = "lts" ]; then set sc_kernel=new; else set sc_kernel=lts; fi
    fi
    set sc_kpending=1
    save_env sc_kernel sc_kpending
fi
if [ "${slot}" != "B" ]; then set slot=A; fi
if [ "${slot}" = "A" ]; then set other=B; else set other=A; fi
if [ "${sc_kernel}" != "lts" ]; then set sc_kernel=new; fi
if [ "${sc_lang}" != "en" ]; then set sc_lang=tr; fi

insmod all_video
set gfxmode=1024x768x32
set gfxpayload=keep
if loadfont unicode; then
    terminal_output gfxterm
fi

menuentry "SimpleClient" {
    search --no-floppy --label --set=root "SC_${slot}"
    linux /vmlinuz-${sc_kernel} quiet loglevel=0 console=tty0 console=ttyS0,115200 panic=5 random.trust_cpu=on net.ifnames=0 vt.global_cursor_default=0 lang=${sc_lang} sc.slot=${slot} sc.kernel=${sc_kernel}
    initrd /initramfs.cpio.gz /modules-${sc_kernel}.cpio.gz
}

menuentry "SimpleClient - LTS kernel / uyumluluk" {
    search --no-floppy --label --set=root "SC_${slot}"
    linux /vmlinuz-lts quiet loglevel=0 console=tty0 console=ttyS0,115200 panic=5 random.trust_cpu=on net.ifnames=0 vt.global_cursor_default=0 lang=${sc_lang} sc.slot=${slot} sc.kernel=lts
    initrd /initramfs.cpio.gz /modules-lts.cpio.gz
}

menuentry "SimpleClient (previous version)" {
    search --no-floppy --label --set=root "SC_${other}"
    linux /vmlinuz-${sc_kernel} quiet loglevel=0 console=tty0 console=ttyS0,115200 panic=5 random.trust_cpu=on net.ifnames=0 vt.global_cursor_default=0 lang=${sc_lang} sc.slot=${other} sc.kernel=${sc_kernel}
    initrd /initramfs.cpio.gz /modules-${sc_kernel}.cpio.gz
}
