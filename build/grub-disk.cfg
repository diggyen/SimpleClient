# GRUB configuration of a disk install; sc-install puts it on the ESP as
# /boot/grub/grub.cfg. Both GRUBs read it: the BIOS one and the signed UEFI one.
#
# The system lives in two slots, SC_A and SC_B, each holding both kernels.
# grubenv carries the choices:
#   sc_boot      the slot known to work
#   sc_try       a slot holding a fresh update, booted once; the kiosk's update
#                (internal/update) sets it. The try is cleared before its kernel
#                even starts, so an update that never reports back — it
#                panicked, hung, or the kiosk would not come up, and the machine
#                was switched off — is followed by a boot of the known-good slot.
#   sc_kernel    "new" or "lts": the kernel known to work on this machine
#   sc_kpending  set on every normal boot and cleared by the kiosk once it is
#                up; still set means the last boot never got there, and the
#                other kernel is tried, as on the USB stick (see the ISO's
#                grub.cfg)
#   sc_gfxtry    the display adapters /init is loading the GPU's own driver
#                for, cleared once that driver has given it a screen. Still set
#                means the boot died there: the first time those adapters go to
#   sc_gfxfail   and get one more try, the second time in a row they join
#   sc_gfxsafe   the display adapters left on the firmware framebuffer; see
#                bootenv.GraphicsTry
#   sc_esp, sc_a, sc_b, sc_data
#                the UUIDs of this disk's partitions, recorded by sc-install
# The kiosk sets sc_boot and sc_kernel to what it runs from once that has proven
# itself, and clears sc_kpending.
set timeout=1
set default=0
# A slot whose kernel will not load — a file missing or damaged, not one that
# starts and then fails — falls back to its LTS kernel, then to the other slot
# ("previous version", the last entry). While an update is tried the other slot
# is the one that works.
set fallback="1 4"

load_env
if [ -n "${sc_gfxtry}" ]; then
    # The GPU's driver is what took the last boot down, not the kernel or the
    # slot: those stay. A boot switched off just then looks the same, so the
    # driver gets one more try; only a second boot in a row that dies there
    # leaves this GPU on the firmware framebuffer.
    if [ "${sc_gfxtry}" = "${sc_gfxfail}" ]; then
        set sc_gfxsafe="${sc_gfxsafe},${sc_gfxtry}"
        set sc_gfxfail=
    else
        set sc_gfxfail="${sc_gfxtry}"
    fi
    set sc_gfxtry=
    set sc_kpending=0
    save_env sc_gfxsafe sc_gfxtry sc_gfxfail
fi
if [ -n "${sc_try}" ]; then
    set slot="${sc_try}"
    set sc_try=
    save_env sc_try
else
    set slot="${sc_boot}"
    if [ "${sc_kpending}" = "1" ]; then
        if [ "${sc_kernel}" = "lts" ]; then set sc_kernel=new; else set sc_kernel=lts; fi
    fi
    set sc_kpending=1
    save_env sc_kernel sc_kpending
fi
if [ "${slot}" != "B" ]; then set slot=A; fi
if [ "${slot}" = "A" ]; then set other=B; else set other=A; fi
if [ "${sc_kernel}" != "lts" ]; then set sc_kernel=new; fi
if [ "${sc_lang}" != "en" ]; then set sc_lang=tr; fi

insmod all_video
set gfxmode=1024x768x32
set gfxpayload=keep
if loadfont unicode; then
    terminal_output gfxterm
fi

# sc_start KERNEL SLOT [ARGS] boots a kernel of a slot, the way the slot's own
# slot.cfg says: each release brings the command line and the initrds it starts
# with, and an update never has to change this file, which both slots share.
# What slot.cfg is given to work with is set here; see build/slot.cfg. The slot
# is found by the UUID sc-install recorded, since another disk in the machine
# can carry the same labels; an install without UUIDs by its label.
function sc_start {
    if [ "$2" = "B" ]; then set sc_dev="${sc_b}"; else set sc_dev="${sc_a}"; fi
    if [ -n "${sc_dev}" ]; then
        search --no-floppy --fs-uuid --set=root "${sc_dev}"
    else
        search --no-floppy --label --set=root "SC_$2"
    fi
    set sc_k="$1"
    set sc_s="$2"
    set sc_x="$3"
    source /slot.cfg
}

menuentry "SimpleClient" {
    sc_start ${sc_kernel} ${slot}
}

menuentry "SimpleClient - LTS kernel / uyumluluk" {
    sc_start lts ${slot}
}

# The firmware framebuffer instead of the GPU's own driver, for this boot: the
# way out of a screen that stays dark with no boot to blame.
menuentry "SimpleClient - Guvenli grafik / safe graphics" {
    sc_start ${sc_kernel} ${slot} sc.gfxsafe=once
}

# Forgets the display adapters left on the firmware framebuffer, and boots
# with their own driver again.
menuentry "SimpleClient - ekran surucusunu yeniden dene / retry display driver" {
    set sc_gfxsafe=
    save_env sc_gfxsafe
    sc_start ${sc_kernel} ${slot}
}

menuentry "SimpleClient (previous version)" {
    sc_start ${sc_kernel} ${other}
}
