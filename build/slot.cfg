# How GRUB boots the system slot this file is in, on a disk install. The
# disk's grub.cfg (build/grub-disk.cfg) picks the slot, makes it GRUB's root
# and reads this file from it, with
#   sc_k        the kernel to boot, "new" or "lts"
#   sc_s        the slot, "A" or "B"
#   sc_x        arguments a boot menu entry adds, if any
#   sc_lang     the UI language, "tr" or "en"
#   sc_gfxsafe  the display adapters left on the firmware framebuffer
#   sc_esp, sc_data
#               the UUIDs of the disk's ESP and data partition, for /init and
#               the kiosk to find this disk's and no other's
# set. Every release brings its own copy into the slot it is installed in,
# with the command line and the initrds its kernels start with: that is how an
# update changes them without touching the grub.cfg both slots share. For
# video=efifb and rootfstype=ramfs see the ISO's grub.cfg.
linux /vmlinuz-${sc_k} quiet loglevel=0 console=tty0 console=ttyS0,115200 panic=5 random.trust_cpu=on net.ifnames=0 vt.global_cursor_default=0 video=efifb:1024x768 rootfstype=ramfs lang=${sc_lang} sc.slot=${sc_s} sc.kernel=${sc_k} sc.gfxsafe=${sc_gfxsafe} sc.esp=${sc_esp} sc.data=${sc_data} ${sc_x}
initrd /initramfs.cpio.gz /modules-${sc_k}.cpio.gz /firmware.cpio
