# How GRUB boots the system slot this file is in. The grub.cfg of a disk
# install (build/grub-disk.cfg), or of a USB stick (build/grub.cfg), picks the
# slot, makes the file system it is on GRUB's root and reads this file from
# it, with
#   sc_dir      the slot's directory on that file system: empty on a disk
#               install, whose slots are file systems of their own;
#               /slots/A or /slots/B on a stick
#   sc_k        the kernel to boot, "new" or "lts"
#   sc_s        the slot, "A" or "B"
#   sc_x        arguments a boot menu entry adds, if any
#   sc_lang     the UI language, "tr" or "en"
#   sc_gfxsafe  the display adapters left on the firmware framebuffer
#   sc_esp, sc_data
#               the UUIDs of the disk's ESP and data partition, for /init and
#               the kiosk to find this disk's and no other's; empty on a stick
# set. Every release brings its own copy into the slot it is installed in,
# with the command line and the initrds its kernels start with: that is how an
# update changes them without touching the grub.cfg both slots share. For
# video=efifb and rootfstype=ramfs see the ISO's grub.cfg, and for the splash,
# which the slot holds as well, and vt.default_*, its sc_start.
if insmod png; then
    background_image ${sc_dir}/splash.png
    clear
fi
linux ${sc_dir}/vmlinuz-${sc_k} quiet loglevel=0 console=tty0 console=ttyS0,115200 panic=5 random.trust_cpu=on net.ifnames=0 vt.global_cursor_default=0 vt.default_red=18 vt.default_grn=19 vt.default_blu=33 video=efifb:1024x768 rootfstype=ramfs lang=${sc_lang} sc.slot=${sc_s} sc.kernel=${sc_k} sc.gfxsafe=${sc_gfxsafe} sc.esp=${sc_esp} sc.data=${sc_data} ${sc_x}
initrd ${sc_dir}/initramfs.cpio.gz ${sc_dir}/modules-${sc_k}.cpio.gz ${sc_dir}/firmware.cpio
