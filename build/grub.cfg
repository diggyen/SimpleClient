set timeout=3
set default=0

# Load video drivers so gfxpayload actually takes effect on both firmware types.
insmod all_video
insmod efi_gop
insmod efi_uga
insmod vbe
insmod vga

# GRUB hands the kernel a simple framebuffer at this mode; simpledrm turns it
# into /dev/fb0. Keep it at 1024x768x32 — the UI layout is designed for it and
# it is the mode every BIOS/UEFI implementation supports.
set gfxmode=1024x768x32
set gfxpayload=keep
terminal_output gfxterm

# net.ifnames=0 gives predictable ethN names, which is what /init expects.
#
# console=ttyS0 comes last so /dev/console lands on the serial port: init's
# progress messages then go to the serial log instead of being painted over the
# kiosk UI. On hardware with no serial port the kernel drops that console and
# falls back to tty0 on its own.
menuentry "SimpleClient (English)" {
    linux /boot/vmlinuz quiet loglevel=0 console=tty0 console=ttyS0,115200 panic=5 random.trust_cpu=on net.ifnames=0 vt.global_cursor_default=0 lang=en
    initrd /boot/initramfs.cpio.gz
}

# ASCII only: GRUB's built-in terminal font has no glyphs for ü/ç, so "Türkçe"
# would render as boxes in the boot menu. The kiosk UI itself renders them fine.
menuentry "SimpleClient (Turkce / Turkish)" {
    linux /boot/vmlinuz quiet loglevel=0 console=tty0 console=ttyS0,115200 panic=5 random.trust_cpu=on net.ifnames=0 vt.global_cursor_default=0 lang=tr
    initrd /boot/initramfs.cpio.gz
}

# Logs the full RDP handshake to the serial port. Use this when a connection
# fails and the on-screen message is not enough to tell why.
menuentry "SimpleClient (RDP handshake debug)" {
    linux /boot/vmlinuz loglevel=4 console=tty0 console=ttyS0,115200 panic=0 random.trust_cpu=on net.ifnames=0 lang=en rdpdebug
    initrd /boot/initramfs.cpio.gz
}

# Mirrors the boot log to the first serial port as well as the screen, which is
# how the QEMU checks in build/test-qemu.sh diagnose a failed boot.
menuentry "SimpleClient (verbose boot / debug)" {
    linux /boot/vmlinuz loglevel=7 console=tty0 console=ttyS0,115200 panic=0 random.trust_cpu=on net.ifnames=0 lang=en
    initrd /boot/initramfs.cpio.gz
}
