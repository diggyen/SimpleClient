set timeout=3
# Turkish is the default: the kiosk boots straight into a Turkish UI with the
# Turkish Q keyboard. English is one arrow press away, and F2/F3 switch both
# at runtime.
set default=1

# Load video drivers so gfxpayload actually takes effect on both firmware types.
#
# all_video is the whole list: GRUB builds it per platform, so it pulls efi_gop
# and efi_uga on x86_64-efi and vbe and vga on i386-pc. Naming those four
# explicitly as well meant every boot printed two "file not found" errors for
# whichever pair belongs to the other firmware — on a UEFI machine the first
# thing on screen was two error lines, which is not what a kiosk should open
# with even when they are harmless.
insmod all_video

# GRUB hands the kernel a framebuffer at this mode, which efifb or vesafb make
# /dev/fb0 until the GPU's own driver takes the display over at its native
# mode — and for good when that driver is not to be used (safe graphics). Keep
# it at 1024x768x32: it is the mode every BIOS/UEFI implementation supports.
set gfxmode=1024x768x32
set gfxpayload=keep
# The graphical terminal draws nothing without a font; keep the text one if the
# font cannot be loaded.
if loadfont unicode; then
    terminal_output gfxterm
fi

# Which kernel: "new" (the newest Debian kernel) unless it did not come up on
# this machine, then "lts" (Debian stable's LTS kernel).
#
# Every boot is marked pending in the USB stick's grubenv, on its SC_EFI
# partition — or, on a stick Rufus wrote in ISO mode, on the one FAT partition
# that has everything, which Rufus labels SIMPLECLIEN; the kiosk clears the
# mark, and records the kernel it runs, once it is up. A mark still set at the next boot means the last one never got that
# far — it panicked, hung or showed nothing and was switched off — so the other
# kernel is tried, and kept for as long as it works. A CD cannot be written: it
# always starts the new kernel, and the menu below offers the other one.
#
# The GPU's own driver gets the same: /init writes down the display adapters
# it is loading a driver for (sc_gfxtry) and clears that once the driver has
# given it a screen. Still set means the boot died there, so it is the GPU, not
# the kernel: those adapters join the ones left on the firmware framebuffer
# from now on (sc_gfxsafe), and the kernel stays. See bootenv.GraphicsTry.
set kernel=new
set gfxsafe=
set scenv=
if search --no-floppy --label --set=scenv SC_EFI; then
    set scenvfs=SC_EFI
elif search --no-floppy --label --set=scenv SIMPLECLIEN; then
    set scenvfs=SIMPLECLIEN
fi
if [ -n "${scenv}" ]; then
    if load_env --file (${scenv})/grubenv sc_kernel sc_kpending sc_gfxtry sc_gfxsafe; then
        if [ -n "${sc_gfxtry}" ]; then
            set sc_gfxsafe="${sc_gfxsafe},${sc_gfxtry}"
            set sc_gfxtry=
        elif [ "${sc_kpending}" = "1" ]; then
            if [ "${sc_kernel}" = "lts" ]; then set sc_kernel=new; else set sc_kernel=lts; fi
        fi
        set sc_kpending=1
        save_env --file (${scenv})/grubenv sc_kernel sc_kpending sc_gfxtry sc_gfxsafe
        if [ "${sc_kernel}" = "lts" ]; then set kernel=lts; fi
        set gfxsafe="${sc_gfxsafe}"
    fi
fi

# sc_start KERNEL LANG [ARGS] boots one of the kernels.
#
# net.ifnames=0 gives predictable ethN names, which is what /init expects.
#
# console=ttyS0 comes last so /dev/console lands on the serial port: init's
# progress messages then go to the serial log instead of being painted over the
# kiosk UI. On hardware with no serial port the kernel drops that console and
# falls back to tty0 on its own.
#
# rdphost=<ip> can be appended to any entry (press 'e' in this menu) to add a
# server outside the scanned subnet: the kiosk only discovers its own, and this
# is the one way past that.
#
# video=efifb:1024x768 has the kernel's EFI stub set GRUB's mode once more,
# through the firmware. GRUB drives a virtual machine's standard VGA (QEMU,
# Proxmox) with a driver of its own, behind the firmware's back; the stub then
# read the firmware's stale mode, and the firmware framebuffer came out
# scrambled. On anything else it sets the mode that is already set.
#
# rootfstype=ramfs has the kernel unpack the initrds into ramfs. Into tmpfs,
# its choice otherwise, they could take only half the memory there was while
# they were still loaded as well: 140 MB on a 512 MB machine, which left the
# firmware archive, unpacked last, cut short.
function sc_start {
    linux /boot/vmlinuz-$1 quiet loglevel=0 console=tty0 console=ttyS0,115200 panic=5 random.trust_cpu=on net.ifnames=0 vt.global_cursor_default=0 video=efifb:1024x768 rootfstype=ramfs lang=$2 sc.kernel=$1 sc.gfxsafe=${gfxsafe} $3
    initrd /boot/initramfs.cpio.gz /boot/modules-$1.cpio.gz /boot/firmware.cpio
}

menuentry "SimpleClient (English)" {
    sc_start ${kernel} en
}

# ASCII only: GRUB's built-in terminal font has no glyphs for ü/ç, so "Türkçe"
# would render as boxes in the boot menu. The kiosk UI itself renders them fine.
menuentry "SimpleClient (Turkce / Turkish)" {
    sc_start ${kernel} tr
}

# The other kernel by hand, for the machine the automatic choice gets wrong.
menuentry "SimpleClient (Turkce) - LTS kernel / uyumluluk" {
    sc_start lts tr
}

# The firmware framebuffer instead of the GPU's own driver, for this boot: the
# way out of a screen that stays dark with no boot to blame.
menuentry "SimpleClient (Turkce) - Guvenli grafik / safe graphics" {
    sc_start ${kernel} tr sc.gfxsafe=once
}

# Forgets the display adapters left on the firmware framebuffer, and boots
# with their own driver again.
menuentry "SimpleClient (Turkce) - ekran surucusunu yeniden dene / retry display driver" {
    if [ -n "${scenv}" ]; then
        set sc_gfxsafe=
        save_env --file (${scenv})/grubenv sc_gfxsafe
    fi
    set gfxsafe=
    sc_start ${kernel} tr
}

# Logs the full RDP handshake to the serial port. Use this when a connection
# fails and the on-screen message is not enough to tell why.
menuentry "SimpleClient (RDP handshake debug)" {
    linux /boot/vmlinuz-${kernel} loglevel=4 console=tty0 console=ttyS0,115200 panic=0 random.trust_cpu=on net.ifnames=0 video=efifb:1024x768 rootfstype=ramfs lang=en rdpdebug sc.kernel=${kernel} sc.gfxsafe=${gfxsafe}
    initrd /boot/initramfs.cpio.gz /boot/modules-${kernel}.cpio.gz /boot/firmware.cpio
}

# Mirrors the boot log to the first serial port as well as the screen, which is
# how the QEMU checks in build/test-qemu.sh diagnose a failed boot.
menuentry "SimpleClient (verbose boot / debug)" {
    linux /boot/vmlinuz-${kernel} loglevel=7 console=tty0 console=ttyS0,115200 panic=0 random.trust_cpu=on net.ifnames=0 video=efifb:1024x768 rootfstype=ramfs lang=en sc.kernel=${kernel} sc.gfxsafe=${gfxsafe}
    initrd /boot/initramfs.cpio.gz /boot/modules-${kernel}.cpio.gz /boot/firmware.cpio
}
