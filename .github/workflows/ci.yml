name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # vendor/ is committed (and patched — see build/patches/), so there is
      # nothing to download. -mod=vendor is passed explicitly everywhere so a
      # stray module fetch fails loudly instead of silently pulling the
      # unpatched grdp, which does not compile for Linux. Go itself checks
      # vendor/modules.txt against go.mod on every -mod=vendor invocation.
      - name: Verify the local grdp patches survived the last re-vendor
        run: |
          test -f vendor/github.com/tomatome/grdp/plugin/cliprdr/stub_notwindows.go
          ! grep -q '^import "C"' vendor/github.com/tomatome/grdp/plugin/channel.go

      - name: Format
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            gofmt -d cmd internal
            exit 1
          fi

      - name: Vet
        run: go vet -mod=vendor ./...

      - name: Test
        run: go test -mod=vendor -race ./... -timeout 120s

      - name: Build static binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -mod=vendor -ldflags '-s -w' -o simpleclient ./cmd/simpleclient

      - name: Verify static binary
        run: file simpleclient | grep "statically linked"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: simpleclient-linux-amd64
          path: simpleclient

  iso:
    # The ISO is what actually ships, so build it on every push to main too —
    # a broken Dockerfile should not first surface at release time.
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ISO
        run: |
          docker buildx build \
            --target export \
            --output type=local,dest=dist \
            -f build/Dockerfile .
          ls -lh dist/

      - name: Sanity-check the ISO
        run: |
          test -s dist/simpleclient.iso
          file dist/simpleclient.iso | grep -qi 'ISO 9660'

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: simpleclient-iso
          path: dist/simpleclient.iso
          retention-days: 14
